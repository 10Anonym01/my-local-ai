<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Local AI diagnostics</title><style>body{font:16px system-ui;background:#0b1220;color:#e8efff;max-width:760px;margin:35px auto;padding:18px}button{padding:14px;border:0;border-radius:9px;background:#9db9ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2840;padding:16px;border-radius:12px}</style><h1>My Local AI — Engine diagnostics</h1><p>This checks whether Safari can fetch and import the two modules used by v0.6. It does not download an AI model or erase your data.</p><button id="run">Run diagnostics</button><pre id="output">Waiting…</pre><script type="module">
const urls=['https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/index.js','https://cdn.jsdelivr.net/npm/@wllama/wllama@3.6.1/esm/wasm-from-cdn.js'];
const out=document.getElementById('output');const log=s=>out.textContent+=s+'\n';
document.getElementById('run').onclick=async()=>{out.textContent='';log('Secure context: '+isSecureContext);log('Browser: '+navigator.userAgent);for(const url of urls){log('\nChecking: '+url);try{const r=await fetch(url,{mode:'cors',cache:'no-store'});log('HTTP: '+r.status+' / content-type: '+r.headers.get('content-type'));if(!r.ok)continue;const t=await r.text();log('Size: '+t.length+' chars; preview: '+t.slice(0,130));}catch(e){log('FETCH FAILED: '+String(e))}try{const m=await import(url);log('IMPORT OK; exports: '+Object.keys(m).slice(0,15).join(', '));}catch(e){log('IMPORT FAILED: '+(e?.stack||String(e)))}}};
</script></html>
